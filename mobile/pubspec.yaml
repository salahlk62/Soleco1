name: soleco_ai_mobile
description: Soleco.ai merchant mobile app (Flutter)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  dio: ^5.4.3
  # firebase_messaging و flutter_local_notifications معطّلة مؤقتاً في هذه النسخة
  # الأولية لأنها تتطلب إعداد مشروع Firebase (google-services.json) قبل البناء.
  # أعد إضافتها عند تفعيل الإشعارات (راجع core/services/notification_service.dart).

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
